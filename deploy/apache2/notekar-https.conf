# Vhost final. Instala solo después de que existan los archivos de Certbot.
# Módulos necesarios: proxy proxy_http headers rewrite ssl
<VirtualHost *:80>
    ServerName notekar.karlosjota.eu

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://notekar.karlosjota.eu%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/notekar-error.log
    CustomLog ${APACHE_LOG_DIR}/notekar-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName notekar.karlosjota.eu

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/notekar.karlosjota.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/notekar.karlosjota.eu/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass / http://127.0.0.1:3000/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/notekar-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/notekar-ssl-access.log combined
</VirtualHost>
