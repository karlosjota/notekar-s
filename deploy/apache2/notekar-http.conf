# Vhost temporal/fase inicial: deja validar el dominio para Certbot por webroot.
# La app Docker debe escuchar en 127.0.0.1:3000.
<VirtualHost *:80>
    ServerName notekar.karlosjota.eu

    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPass / http://127.0.0.1:3000/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/notekar-error.log
    CustomLog ${APACHE_LOG_DIR}/notekar-access.log combined
</VirtualHost>
